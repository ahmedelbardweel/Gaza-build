name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Flutter iOS Application
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 💙 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🔍 Analyze Code
        run: flutter analyze

      - name: 🔨 Build iOS (Release, No Codesign)
        run: flutter build ios --release --no-codesign

      - name: 📦 Package Unsigned Payload as IPA
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r GazaBuild_Unsigned.ipa Payload
          cd ../../..

      - name: 🚀 Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GazaBuild-iOS-IPA
          path: build/ios/iphoneos/GazaBuild_Unsigned.ipa
          retention-days: 14

      - name: 🚀 Upload Runner.app Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GazaBuild-iOS-App
          path: build/ios/iphoneos/Runner.app
          retention-days: 14
